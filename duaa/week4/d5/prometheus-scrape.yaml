# GIVEN, NOT TAUGHT (wk-4 go-live ships it; wk-5 teaches it).
# A single in-cluster Prometheus scraping your release every 15s, so that when
# week 5 opens Grafana, your service already has days of history behind it.
# The PVC below is what makes "days of history" survive pod restarts and
# laptop sleeps; `kind delete cluster` still erases everything (the volume
# lives inside the node container) - the one honest caveat.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: serving
        metrics_path: /metrics
        static_configs:
          - targets: ["team-serving:8000"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prom-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. At one replica the default resolves
  # to maxUnavailable 0 / maxSurge 1, so a restart starts the new pod BEFORE
  # stopping the old one. Both then mount this RWO PVC on the same node and the
  # second Prometheus dies on "lock DB directory: resource temporarily
  # unavailable", leaving the old pod serving the old config and the rollout
  # stuck forever. Week 5 restarts this deployment to load the game-day alert
  # rules, so that deadlock would take the scored afternoon with it.
  strategy:
    type: Recreate
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml",
                 "--storage.tsdb.retention.time=30d"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prom-config}
        - name: data
          persistentVolumeClaim: {claimName: prom-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: {app: prometheus}
  ports:
    - port: 9090
      targetPort: 9090
