apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-inbox-code
data:
  inbox.py: |
    from collections import deque
    from datetime import datetime,timezone
    from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
    import json,threading
    records=deque(maxlen=200)
    lock=threading.Lock()
    class Handler(BaseHTTPRequestHandler):
     def log_message(self,*args): pass
     def do_GET(self):
      with lock: data={'status':'ok'} if self.path=='/health' else list(records)
      raw=json.dumps(data).encode();self.send_response(200);self.send_header('Content-Type','application/json');self.end_headers();self.wfile.write(raw)
     def do_POST(self):
      size=int(self.headers.get('Content-Length','0'))
      if size<1 or size>262144:self.send_error(413);return
      try: data=json.loads(self.rfile.read(size))
      except (ValueError,UnicodeDecodeError):self.send_error(400);return
      row={'received_at':datetime.now(timezone.utc).isoformat(timespec='seconds'),'status':data.get('status'),'alerts':[{'status':a.get('status'),'labels':a.get('labels',{}),'annotations':a.get('annotations',{}),'startsAt':a.get('startsAt'),'endsAt':a.get('endsAt'),'values':a.get('values',{})} for a in data.get('alerts',[])]}
      with lock:records.append(row)
      print(json.dumps(row,ensure_ascii=False),flush=True)
      self.send_response(200);self.end_headers();self.wfile.write(b'ok')
    ThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-inbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-inbox
  template:
    metadata:
      labels:
        app: alert-inbox
    spec:
      containers:
        - name: inbox
          image: python:3.12-alpine
          command: [python3, -u, /app/inbox.py]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: alert-inbox-code
---
apiVersion: v1
kind: Service
metadata:
  name: alert-inbox
spec:
  type: ClusterIP
  selector:
    app: alert-inbox
  ports:
    - port: 8080
      targetPort: 8080
